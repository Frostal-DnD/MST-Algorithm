<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Vizualizare MST - Prim & Kruskal</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
</head>
<body>

  <!-- TOP BUTTONS -->
  <div id="top-bar">
    <a href="Kruskal.exe" download>
      <button class="top-btn">📥 Descarcă Kruskal C++</button>
    </a>
    <button class="top-btn" onclick="runKruskal()">▶ Lansare Kruskal</button>
    <button class="top-btn" onclick="runPrim()">▶ Lansare Prim</button>
    <a href="Prim.exe" download>
      <button class="top-btn">📥 Descarcă Prim C++</button>
    </a>
  </div>

  <div id="preset-bar">
      <button onclick="loadPreset(1)">Graf 1</button>
      <button onclick="loadPreset(2)">Graf 2</button>
      <button onclick="loadPreset(3)">Graf 3</button>
      <button onclick="loadPreset(4)">Graf 4</button>
      <button onclick="loadPreset(5)">Graf 5</button>
      <button onclick="loadPreset(6)">Graf 6</button>
  </div>



  <!-- MAIN CONTENT -->
  <div id="main">

    <!-- LEFT: Input graf -->
    <div id="panel-left">
      <h3>Introducem<br>graful</h3>
      <textarea id="inputGraph" rows="14" spellcheck="false">
1 2 1
1 3 2
1 4 3
1 5 4
1 6 5
1 7 6
1 8 7
2 3 50
3 4 60
4 5 70
5 6 80
6 7 90
7 8 100
      </textarea>
    </div>

    <!-- CENTER: Graph canvas -->
    <div id="panel-center">
      <div id="cy-wrapper">
        <div id="cy"></div>
      </div>
    </div>

    <!-- RIGHT: Results -->
    <div id="panel-right">
      <h3>Rezultat, MST și<br>timpul de execuție</h3>
      <pre id="output">—</pre>
      <div id="timing" style="display:none;">
        <span id="timing-label">⏱ Timp:</span>
        <span id="timing-value"></span>
      </div>
    </div>

  </div>

<script src="script.js"></script>
</body>
</html>
